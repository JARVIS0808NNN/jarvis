<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prova JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prova JARVIS">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#efe1e1;font-family:system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;display:flex;flex-direction:column;gap:14px}
h1{font-size:15px;letter-spacing:.4em;color:#d4202f}
.b{border:0;border-radius:30px;padding:16px;font-size:17px;color:#fff;background:#ff4a3d;box-shadow:0 0 24px rgba(255,74,61,.4)}
.b.v{background:#5c0a14;box-shadow:none;font-size:15px;padding:12px}
#info{font-size:13px;color:#9a7f82;line-height:1.5}
#out{flex:1;overflow-y:auto;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;border:1px solid #3a1218;border-radius:12px;padding:12px;background:#0e0506}
#out div{margin-bottom:4px}
</style>
</head>
<body>
<h1>PROVA MICROFONO</h1>
<div id="info"></div>
<button class="b" id="parla">TOCCA E PARLA</button>
<button class="b v" id="voce">Prova la voce</button>
<div id="out"></div>
<script>
var out=document.getElementById("out");
function p(t){var d=document.createElement("div");d.textContent=new Date().toTimeString().slice(0,8)+"  "+t;out.appendChild(d);out.scrollTop=out.scrollHeight;}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var standalone=(window.navigator.standalone===true)||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
document.getElementById("info").textContent="Riconoscimento vocale: "+(SR?"presente":"NON presente")+" | Aperta come app a schermo intero: "+(standalone?"sì":"no");
p("Pagina caricata.");
document.getElementById("parla").onclick=function(){
  if(!SR){p("ERRORE: riconoscimento vocale non presente.");return;}
  var r=new SR();r.lang="it-IT";r.interimResults=true;r.continuous=false;
  r.onstart=function(){p("Microfono avviato. Parli ora.");};
  r.onaudiostart=function(){p("Sto sentendo l'audio.");};
  r.onspeechstart=function(){p("Ho sentito una voce.");};
  r.onresult=function(e){var x=e.results[e.results.length-1];p((x.isFinal?"FRASE: ":"parziale: ")+x[0].transcript);};
  r.onerror=function(e){p("ERRORE: "+e.error);};
  r.onend=function(){p("Microfono chiuso.");};
  try{r.start();}catch(x){p("ERRORE all'avvio: "+x.message);}
};
document.getElementById("voce").onclick=function(){
  if(!window.speechSynthesis){p("ERRORE: voce non presente.");return;}
  var u=new SpeechSynthesisUtterance("Buongiorno, Signore. La voce funziona.");u.lang="it-IT";
  u.onstart=function(){p("Voce avviata.");};u.onerror=function(e){p("ERRORE voce: "+e.error);};u.onend=function(){p("Voce terminata.");};
  speechSynthesis.cancel();speechSynthesis.speak(u);
};
</script>
</body>
</html>
