<style>
:root{--bg:#000;--red:#ff4a3d;--crimson:#d4202f;--deep:#5c0a14;--text:#efe1e1;--dim:#9a7f82;--line:#3a1218;--card:#0e0506}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
button{font-family:inherit}
.view{display:none;height:100%;flex-direction:column;padding:14px 18px 12px}
.view.on{display:flex}
h1{font-size:15px;font-weight:600;letter-spacing:.42em;color:var(--crimson)}
h2{font-size:20px;font-weight:500;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;flex:none;min-height:40px}
.stato{font-size:13px;color:var(--dim)}
.menu{background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:38px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px}
.menu i{display:block;height:2px;background:var(--red);border-radius:2px}
.back{background:none;border:0;color:var(--crimson);font-size:15px;padding:6px 0}

/* HOME */
#home{overflow-y:auto}
.orbwrap{flex:none;display:flex;align-items:center;justify-content:center;padding:14px 0 18px}
.orb{pointer-events:none;position:relative;width:min(56vw,230px);aspect-ratio:1;--c:var(--crimson);--s:18s}
.orb i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--c);opacity:.55;transition:border-color .6s}
.orb i:nth-child(1){animation:spin var(--s) linear infinite;border-style:dashed}
.orb i:nth-child(2){inset:12%;border-color:var(--red);opacity:.45;animation:spin calc(var(--s)*.7) linear infinite reverse;border-top-color:transparent}
.orb i:nth-child(3){inset:26%;animation:spin calc(var(--s)*.5) linear infinite;border-width:2px;border-left-color:transparent}
.orb b{position:absolute;inset:40%;border-radius:50%;background:radial-gradient(circle,var(--c),var(--deep) 70%,transparent 72%);box-shadow:0 0 50px var(--c);animation:pulse 3.2s ease-in-out infinite;transition:background .6s,box-shadow .6s}
.orb[data-s=ascolto]{--c:var(--red);--s:10s}
.orb[data-s=elaborazione]{--c:var(--crimson);--s:2.5s}
.orb[data-s=risposta]{--c:#ff9a8a;--s:6s}
.orb[data-s=elaborazione] b{animation-duration:.9s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.18);opacity:.8}}
#btnparla{position:relative;z-index:5;flex:none;align-self:center;background:var(--red);color:#fff;border:0;border-radius:30px;padding:13px 44px;font-size:16px;letter-spacing:.08em;margin-bottom:12px;box-shadow:0 0 24px rgba(255,74,61,.45)}
#btnparla:active{transform:scale(.97)}
.ultima{flex:none;text-align:center;font-size:16px;line-height:1.45;min-height:48px;margin-bottom:14px;padding:0 6px}
.pannelli{flex:none;display:flex;flex-direction:column;gap:10px}
.pan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pan header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pan h3{font-size:14px;font-weight:600;letter-spacing:.05em}
.pan header span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
.righe{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.55;max-height:150px;overflow-y:auto}
.righe div{border-left:2px solid var(--crimson);padding-left:9px;margin-bottom:5px}
.righe small{color:var(--dim);margin-right:6px}
.righe .vuoto{border-left-color:var(--line);color:var(--dim)}
.demo{flex:none;align-self:center;background:none;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:9px 20px;font-size:13px;margin:12px 0 6px}
.demo:active{border-color:var(--red)}
.nota{text-align:center;font-size:11.5px;color:var(--dim);padding-bottom:10px}

/* MENU LATERALE */
#vel{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:40}
#vel.on{display:block}
#cass{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:310px;background:#090304;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s ease;z-index:50;padding:calc(env(safe-area-inset-top) + 22px) 14px 20px;overflow-y:auto}
#cass.on{transform:none}
#cass h1{padding:0 8px 16px}
.voce{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;color:var(--text);font-size:16px;padding:13px 12px;margin-bottom:2px}
.voce small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.voce.att,.voce:active{background:#1a070a}
.voce.att{border-left:3px solid var(--red)}

/* ALTRE SCHERMATE */
.vuotoTxt{margin:auto;text-align:center;color:var(--dim);line-height:1.5;max-width:30ch}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 0}
.m{max-width:85%;padding:10px 13px;border-radius:14px;line-height:1.4;font-size:15px}
.m.io{align-self:flex-end;background:var(--deep)}
.m.j{align-self:flex-start;border:1px solid var(--line);background:var(--card)}
.bar{display:flex;gap:8px;flex:none}
.bar input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font-size:16px;font-family:inherit}
.bar button{background:var(--red);border:0;border-radius:12px;color:#fff;padding:0 16px;font-size:15px}
#log{flex:1;overflow-y:auto;padding:14px 0;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7}
#log div{border-left:2px solid var(--crimson);padding-left:10px;margin-bottom:6px}
#log small{color:var(--dim);margin-right:8px}
.cur::after{content:'\25AE';color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.imp{flex:1;overflow-y:auto;padding-top:10px}
.imp h3{font-size:14px;letter-spacing:.05em;margin-bottom:10px}
.voceop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.voceop.sel{border-color:var(--red)}
.imp label{display:block;font-size:14px;color:var(--dim);margin:14px 0 4px}
.imp input[type=range]{width:100%;accent-color:var(--red)}
button:focus-visible,input:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.orb i,.orb b,#cass{animation:none;transition:none}}
</style>
</head>
<body>

<div id="vel"></div>
<nav id="cass" aria-label="Menu"></nav>

<section class="view on" id="home">
  <div class="top">
    <button class="menu" id="apriMenu" aria-label="Apri menu"><i></i><i></i><i></i></button>
    <h1>JARVIS</h1>
    <div class="stato" id="stato" aria-live="polite">Inattivo</div>
  </div>
  <div class="orbwrap"><div class="orb" id="orb" data-s="inattivo"><i></i><i></i><i></i><b></b></div></div>
  <button id="btnparla">PARLA</button>
  <div class="ultima" id="ultima" aria-live="polite"></div>
  <button class="demo" id="btnConv" style="margin:0 auto 12px">Conversazione continua: spenta</button>
  <div class="pannelli" id="pannelli"></div>
  <button class="demo" id="btnDemo">Mostra una dimostrazione</button>
  <div class="nota">Le voci marcate DEMO sono simulate. Le altre sono attività reali.</div>
</section>

<section class="view" id="chat">
  <div class="top"><button class="back" data-go="home">Indietro</button><h2>Chat</h2><div class="stato" data-stato>Inattivo</div></div>
  <div id="msgs"></div>
  <div class="bar"><input id="testo" placeholder="Scriva a JARVIS" autocomplete="off"><button id="invia">Invia</button></div>
</section>

<section class="view" id="attivita">
  <div class="top"><button class="back" data-go="home">Indietro</button><h2>Attività</h2><div class="stato" data-stato>Inattivo</div></div>
  <div id="log" role="log"></div>
</section>

<section class="view" id="impostazioni">
  <div class="top"><button class="back" data-go="home">Indietro</button><h2>Impostazioni</h2><span></span></div>
  <div class="imp">
    <h3>Voce di JARVIS</h3>
    <div id="elencoVoci"></div>
    <button class="demo" id="aggVoci" style="margin:6px 0">Aggiorna elenco</button>
    <label>Velocità <input type="range" id="sliderVel" min="0.7" max="1.3" step="0.05"></label>
    <label>Tono <input type="range" id="sliderTono" min="0.7" max="1.3" step="0.05"></label>
    <button class="demo" id="provaVoce" style="margin:14px 0 6px">Prova la voce</button>
    <p class="nota" id="notaVoci" style="text-align:left"></p>
  </div>
</section>

<section class="view" id="altro">
  <div class="top"><button class="back" data-go="home">Indietro</button><h2 id="titolo"></h2><span></span></div>
  <p class="vuotoTxt" id="descr"></p>
</section>

<script>
"use strict";
var VERSIONE="0.8 - 17/11/2026";
var SEZIONI=[
 ["home","Home","Cerchio e pannelli in diretta",""],
 ["attivita","Attività","Registro di JARVIS",""],
 ["chat","Chat","Parli con JARVIS",""],
 ["gmail","Gmail","Email e priorità","Questa sezione mostrerà le email importanti. Sarà attivata dopo il collegamento sicuro a Gmail."],
 ["notifiche","Notifiche","Avvisi di JARVIS","Qui comparirà lo storico degli avvisi. Arriverà con le notifiche push."],
 ["posizione","Posizione","Dove si trova","Posizione e territorio saranno attivati in una fase successiva, solo con la Sua autorizzazione."],
 ["dispositivi","Dispositivi","Casa e computer","Il controllo dei dispositivi arriverà in una fase successiva."],
 ["business","Business","Idee e progetti","Qui raccoglieremo le Sue idee di business. Sarà una delle prime sezioni attivate."],
 ["cervello","Cervello","Memoria di JARVIS","Qui potrà leggere, correggere ed eliminare tutto ciò che JARVIS ricorda. La memoria nasce nel passo successivo."],
 ["impostazioni","Impostazioni","Voce e permessi",""]
];
var STATI={inattivo:"Inattivo",ascolto:"In ascolto",elaborazione:"Elaborazione",risposta:"Risposta"};
var orb=document.getElementById("orb");

function stato(s){
  orb.dataset.s=s;
  document.getElementById("stato").textContent=STATI[s];
  document.querySelectorAll("[data-stato]").forEach(function(e){e.textContent=STATI[s];});
}
function scrivi(el,t,fine){
  if(el._iv)clearInterval(el._iv);
  var i=0;el.classList.add("cur");
  el._iv=setInterval(function(){
    i++;el.textContent=t.slice(0,i);
    if(i>=t.length){clearInterval(el._iv);el._iv=null;el.classList.remove("cur");if(fine)fine();}
  },22);
}

/* menu laterale */
var cass=document.getElementById("cass"),vel=document.getElementById("vel");
function menu(on){cass.classList.toggle("on",on);vel.classList.toggle("on",on);}
function vai(id){
  document.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",v.id===id);});
  document.querySelectorAll(".voce").forEach(function(b){b.classList.toggle("att",b.dataset.id===id);});
}

/* ===== VOCE: motore robusto ===== */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var btn=document.getElementById("btnparla");
var ultimaEl=document.getElementById("ultima");
var VOCE={fase:"idle",rec:null,tent:0,parz:"",finito:false,errore:false,manuale:false,conv:false,ttsId:0,tStart:null,tSil:null,tMax:null,tAudio:null,tRetry:null,tTts:null,utt:null,sentito:false,audioOk:false,fineTTS:0,inAttesa:false};
var ETICHETTE={idle:"PARLA",ascolto:"IN ASCOLTO · TOCCA PER CHIUDERE",pensa:"ELABORO...",parla:"INTERROMPI"};
function imposta(f){VOCE.fase=f;btn.textContent=ETICHETTE[f];}

/* statistiche: servono a capire perché a volte non Ti sente */
var STAT={};
try{STAT=JSON.parse(localStorage.getItem("jv_stat")||"{}");}catch(x){STAT={};}
function statInc(k){STAT[k]=(STAT[k]||0)+1;try{localStorage.setItem("jv_stat",JSON.stringify(STAT));}catch(x){}}
function statTxt(){return "Microfono: riuscite "+(STAT.ok||0)+" su "+(STAT.tent||0)+" avvii | nessuna voce "+(STAT.nospeech||0)+" | occupato "+(STAT.audio||0)+" | rete "+(STAT.net||0)+" | avvio bloccato "+(STAT.hang||0)+" | senza audio "+(STAT.silenzio||0);}
if(STAT.tent)log("Statistiche precedenti. "+statTxt());

function pulisciT(){clearTimeout(VOCE.tStart);clearTimeout(VOCE.tSil);clearTimeout(VOCE.tMax);clearTimeout(VOCE.tAudio);clearTimeout(VOCE.tRetry);}
function fallito(msg){
  pulisciT();VOCE.rec=null;VOCE.conv=false;aggConv();
  imposta("idle");stato("inattivo");log(msg);ultimaEl.textContent=msg;
}
function riprova(motivo,max){
  if(VOCE.tent<max){log(motivo+": riprovo.");clearTimeout(VOCE.tRetry);VOCE.tRetry=setTimeout(function(){ascolta(true);},700);}
  else{fallito(motivo+". Tocchi di nuovo PARLA, Signore.");}
}
function chiudi(testo){
  if(VOCE.finito)return;
  VOCE.finito=true;pulisciT();statInc("ok");
  var r=VOCE.rec;VOCE.rec=null;try{r.abort();}catch(x){}
  log("Ho capito: "+testo);
  elabora(testo,true);
}
function ascolta(retry){
  if(!SR){
    log("Riconoscimento vocale non disponibile in questa pagina.");
    aggiungi("Il microfono non è disponibile in questa pagina, Signore. Usi il microfono della tastiera.","j");
    vai("chat");return;
  }
  pulisciT();
  if(VOCE.rec){var vecchio=VOCE.rec;VOCE.rec=null;try{vecchio.abort();}catch(x){}} /* mai due microfoni aperti insieme */
  if(!retry)VOCE.tent=0;
  VOCE.tent++;statInc("tent");
  VOCE.parz="";VOCE.finito=false;VOCE.errore=false;VOCE.manuale=false;VOCE.sentito=false;VOCE.audioOk=false;
  VOCE.ttsId++;try{speechSynthesis.cancel();}catch(x){}
  var r=new SR();VOCE.rec=r;
  r.lang="it-IT";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  imposta("ascolto");stato("ascolto");
  log("In ascolto (tentativo "+VOCE.tent+")...");
  r.onstart=function(){
    if(VOCE.rec!==r)return;clearTimeout(VOCE.tStart);log("Microfono pronto.");
    /* microfono sordo: nessun segnale audio e nessuna voce entro 4 secondi */
    VOCE.tAudio=setTimeout(function(){
      if(VOCE.rec!==r||VOCE.audioOk||VOCE.sentito||VOCE.parz)return;
      statInc("silenzio");log("Microfono sordo: lo riapro.");
      VOCE.rec=null;try{r.abort();}catch(x){}
      riprova("Microfono senza audio",3);
    },4000);
  };
  r.onaudiostart=function(){
    if(VOCE.rec!==r)return;VOCE.audioOk=true;clearTimeout(VOCE.tAudio);log("Audio in ingresso attivo.");
    /* il microfono funziona: aspetto con calma che Lei parli, fino a 10 secondi */
    VOCE.tAudio=setTimeout(function(){
      if(VOCE.rec!==r||VOCE.sentito||VOCE.parz)return;
      log("Nessuna voce in 10 secondi: chiudo l'ascolto.");
      VOCE.rec=null;pulisciT();try{r.abort();}catch(x){}
      imposta("idle");stato("inattivo");ultimaEl.textContent="Non ho sentito nulla, Signore.";
    },10000);
  };
  r.onspeechstart=function(){if(VOCE.rec!==r)return;clearTimeout(VOCE.tAudio);VOCE.sentito=true;log("Sento la Sua voce.");};
  r.onresult=function(e){
    if(VOCE.rec!==r)return;
    var full="",fin=false;
    for(var i=0;i<e.results.length;i++){full+=e.results[i][0].transcript;fin=e.results[i].isFinal;}
    VOCE.parz=full.trim();clearTimeout(VOCE.tAudio);
    if(ultimaEl._iv){clearInterval(ultimaEl._iv);ultimaEl._iv=null;}
    ultimaEl.classList.remove("cur");ultimaEl.textContent=VOCE.parz;
    clearTimeout(VOCE.tSil);
    if(fin){chiudi(VOCE.parz);}
    else{VOCE.tSil=setTimeout(function(){if(VOCE.rec!==r)return;log("Silenzio: concludo l'ascolto.");try{r.stop();}catch(x){}},1700);}
  };
  r.onerror=function(e){
    if(VOCE.rec!==r||VOCE.finito||VOCE.errore)return;
    VOCE.errore=true;var c=e.error;log("Errore microfono: "+c);
    if(c==="aborted"&&VOCE.manuale)return;
    if(c==="not-allowed"||c==="service-not-allowed"){fallito("Il microfono è bloccato. Riapra l'app e tocchi Consenti, oppure controlli Impostazioni, Safari, Microfono.");return;}
    if(c==="no-speech"){statInc("nospeech");riprova("Non ho sentito nulla",2);return;}
    if(c==="audio-capture"){statInc("audio");riprova("Microfono occupato",3);return;}
    if(c==="network"){statInc("net");riprova("Problema di rete",3);return;}
    riprova("Errore "+c,2);
  };
  r.onend=function(){
    if(VOCE.rec!==r||VOCE.finito||VOCE.errore)return;
    clearTimeout(VOCE.tStart);
    if(VOCE.parz.length>1){log("Ascolto chiuso: uso quanto ho sentito.");chiudi(VOCE.parz);}
    else if(VOCE.manuale){fallito("Nessuna voce rilevata.");}
    else{riprova("Ascolto chiuso senza voce",2);}
  };
  /* controllo: se iPhone non avvia il microfono entro 3,5 secondi */
  VOCE.tStart=setTimeout(function(){
    if(VOCE.rec!==r)return;
    statInc("hang");log("Avvio bloccato: ricomincio.");
    VOCE.rec=null;try{r.abort();}catch(x){}
    riprova("Avvio bloccato",3);
  },3500);
  /* limite massimo di ascolto */
  VOCE.tMax=setTimeout(function(){if(VOCE.rec!==r)return;log("Tempo massimo: concludo.");try{r.stop();}catch(x){}},20000);
  try{r.start();}catch(x){VOCE.rec=null;fallito("Impossibile avviare il microfono.");}
}

/* ===== VOCE DI JARVIS ===== */
function sblocca(){
  if(!window.speechSynthesis)return;
  try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(x){}
}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(x){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(x){}}
function numLs(k,d){var n=parseFloat(lsGet(k,""));return isNaN(n)?d:n;}
var VOCE_SCELTA=null,ULTIMO_ELENCO="";
function vociItaliane(){
  var tutte=window.speechSynthesis?speechSynthesis.getVoices():[];
  return tutte.filter(function(v){return v.lang&&v.lang.toLowerCase().replace("_","-").indexOf("it")===0;});
}
function sceltaVoce(){
  var vs=vociItaliane();
  if(!vs.length)return VOCE_SCELTA;
  var sc=lsGet("jv_voce_sc","");
  var v=(sc&&vs.filter(function(x){return x.name===sc;})[0])
     ||vs.filter(function(x){return /luca/i.test(x.name);})[0]
     ||vs.filter(function(x){return /premium|enhanced|migliorata/i.test(x.name);})[0]
     ||vs[0];
  VOCE_SCELTA=v;return v;
}
function logVoci(){
  var n=vociItaliane().map(function(v){return v.name;}).join(", ")||"nessuna";
  if(n!==ULTIMO_ELENCO){ULTIMO_ELENCO=n;log("Voci italiane disponibili: "+n);}
}
setTimeout(logVoci,1500);setTimeout(logVoci,4000);
function fineVoce(fine){
  clearTimeout(VOCE.tTts);VOCE.fineTTS=Date.now();
  if(VOCE.fase==="parla"){imposta("idle");stato("inattivo");}
  if(fine)fine();
}
function fermaVoce(){clearTimeout(VOCE.tTts);VOCE.fineTTS=Date.now();VOCE.ttsId++;try{speechSynthesis.cancel();}catch(x){}if(VOCE.fase==="parla"){imposta("idle");stato("inattivo");}}
function pronuncia(t,fine){
  if(!window.speechSynthesis){fineVoce(fine);return;}
  var id=++VOCE.ttsId;
  var parti=t.match(/[^.!?]+[.!?]*/g)||[t];
  var i=0;
  imposta("parla");stato("risposta");
  function prossima(){
    if(id!==VOCE.ttsId)return;
    if(i>=parti.length){log("Voce terminata.");fineVoce(fine);return;}
    var u=new SpeechSynthesisUtterance(parti[i++].trim());
    u.lang="it-IT";u.rate=numLs("jv_vel",0.95);u.pitch=numLs("jv_tono",1);
    var v=sceltaVoce();if(v)u.voice=v;
    if(i===1)u.onstart=function(){if(id===VOCE.ttsId)log("Voce avviata: "+(v?v.name:"predefinita")+".");};
    VOCE.utt=u; /* riferimento tenuto: alcuni browser perdono la frase e non avvisano mai della fine */
    clearTimeout(VOCE.tTts);
    VOCE.tTts=setTimeout(function(){
      if(id!==VOCE.ttsId)return;
      log("Voce senza fine: proseguo.");u.onend=null;u.onerror=null;
      try{speechSynthesis.cancel();}catch(x){}prossima();
    },Math.max(6000,u.text.length*140+4000));
    u.onend=function(){clearTimeout(VOCE.tTts);prossima();};
    u.onerror=function(e){if(id!==VOCE.ttsId)return;log("Errore voce: "+e.error);fineVoce(fine);};
    speechSynthesis.speak(u);
  }
  try{speechSynthesis.cancel();}catch(x){}
  setTimeout(prossima,200);
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){logVoci();};

/* ===== RICHIESTE ===== */
function elabora(t,vocale){
  aggiungi(t,"io");
  stato("elaborazione");
  if(vocale)imposta("pensa");
  log("Ricevuta la Sua richiesta.");log("Elaboro la richiesta...");
  riga("ric","Nessuna ricerca eseguita: il motore non è ancora collegato.");
  setTimeout(function(){
    var r="Messaggio ricevuto, Signore. Per ora non posso ancora rispondere nel merito.";
    stato("risposta");aggiungi(r,"j",true);
    log("Risposta preparata. Cervello AI non ancora collegato.");
    scrivi(ultimaEl,r);
    if(vocale){
      setTimeout(function(){
        pronuncia(r,function(){
          if(VOCE.conv){setTimeout(function(){if(VOCE.conv&&VOCE.fase==="idle"){log("Conversazione: riascolto.");ascolta(false);}},1000);}
        });
      },350);
    }else{setTimeout(function(){if(VOCE.fase==="idle")stato("inattivo");},1800);}
  },900);
}
function invia(){var t=testo.value.trim();if(!t)return;testo.value="";elabora(t,false);}
document.getElementById("invia").onclick=invia;
testo.addEventListener("keydown",function(e){if(e.key==="Enter")invia();});

/* ===== PULSANTI ===== */
btn.onclick=function(){
  if(VOCE.fase!=="ascolto")sblocca(); /* durante l'ascolto non tocco la voce: potrebbe disturbare il microfono */
  if(VOCE.inAttesa)return;
  if(VOCE.fase==="ascolto"){
    var r1=VOCE.rec;
    if(!VOCE.sentito&&VOCE.parz.length<2){ /* nessuna voce ancora: il tocco annulla subito */
      log("Ascolto annullato.");
      VOCE.rec=null;pulisciT();try{r1.abort();}catch(x){}
      imposta("idle");stato("inattivo");ultimaEl.textContent="Ascolto annullato. Tocchi PARLA quando vuole, Signore.";
      VOCE.fineTTS=Date.now(); /* piccola pausa prima del prossimo avvio: evita "microfono occupato" */
      return;
    }
    if(VOCE.manuale){ /* secondo tocco: chiusura forzata */
      log("Ascolto chiuso a forza.");VOCE.rec=null;pulisciT();try{r1.abort();}catch(x){}
      imposta("idle");stato("inattivo");return;
    }
    log("Ascolto concluso a mano.");VOCE.manuale=true;
    try{r1.stop();}catch(x){}
    setTimeout(function(){ /* se iPhone non risponde allo stop */
      if(VOCE.rec!==r1||VOCE.fase!=="ascolto")return;
      log("Ascolto bloccato: lo chiudo io.");
      if(VOCE.parz.length>1){chiudi(VOCE.parz);}
      else{VOCE.rec=null;pulisciT();try{r1.abort();}catch(x){}imposta("idle");stato("inattivo");ultimaEl.textContent="Nessuna voce rilevata.";}
    },1500);
    return;
  }
  if(VOCE.fase==="pensa")return;
  if(VOCE.fase==="parla"){fermaVoce();log("Voce interrotta.");}
  /* iPhone ha bisogno di un istante per restituire il microfono dopo la voce */
  var attesa=Math.max(0,900-(Date.now()-VOCE.fineTTS));
  if(attesa>0){
    VOCE.inAttesa=true;
    setTimeout(function(){VOCE.inAttesa=false;ascolta(false);},attesa);
  }else{ascolta(false);}
};
function aggConv(){document.getElementById("btnConv").textContent="Conversazione continua: "+(VOCE.conv?"accesa":"spenta");}
document.getElementById("btnConv").onclick=function(){
  VOCE.conv=!VOCE.conv;aggConv();
  log(VOCE.conv?"Conversazione continua accesa: dopo ogni risposta riascolto da solo.":"Conversazione continua spenta.");
};
/* ===== IMPOSTAZIONI VOCE ===== */
function parlaProva(v){
  if(!window.speechSynthesis)return;
  var u=new SpeechSynthesisUtterance("Buongiorno, Signore. Sono JARVIS, a Sua disposizione.");
  u.lang="it-IT";u.rate=numLs("jv_vel",0.95);u.pitch=numLs("jv_tono",1);if(v)u.voice=v;
  try{speechSynthesis.cancel();}catch(x){}
  speechSynthesis.speak(u);
}
function mostraVoci(){
  var box=document.getElementById("elencoVoci");box.innerHTML="";
  var vs=vociItaliane();
  var tot=window.speechSynthesis?speechSynthesis.getVoices().length:0;
  document.getElementById("notaVoci").textContent="Versione "+VERSIONE+". Il browser vede "+tot+" voci, di cui "+vs.length+" italiane. Se una voce che ha scaricato non compare, il browser non la mette a disposizione delle pagine web.";
  if(!vs.length){var p=document.createElement("p");p.className="nota";p.style.textAlign="left";p.textContent="Nessuna voce italiana visibile al momento. Tocchi Aggiorna elenco.";box.appendChild(p);return;}
  var att=sceltaVoce();
  vs.forEach(function(v){
    var sel=att&&att.name===v.name;
    var riga=document.createElement("div");riga.className="voceop"+(sel?" sel":"");
    var nome=document.createElement("span");nome.textContent=(sel?"✓ ":"")+v.name;
    var pb=document.createElement("button");pb.className="back";pb.textContent="Prova";
    pb.onclick=function(e){e.stopPropagation();parlaProva(v);};
    riga.onclick=function(){lsSet("jv_voce_sc",v.name);mostraVoci();parlaProva(v);};
    riga.appendChild(nome);riga.appendChild(pb);box.appendChild(riga);
  });
}
var elVel=document.getElementById("sliderVel"),elTono=document.getElementById("sliderTono");
elVel.value=numLs("jv_vel",0.95);elTono.value=numLs("jv_tono",1);
elVel.oninput=function(){lsSet("jv_vel",elVel.value);};
elTono.oninput=function(){lsSet("jv_tono",elTono.value);};
document.getElementById("aggVoci").onclick=function(){logVoci();mostraVoci();};
document.getElementById("provaVoce").onclick=function(){parlaProva(sceltaVoce());};
/* se la pagina va in secondo piano mentre ascolta */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&VOCE.fase==="ascolto"){
    var r=VOCE.rec;VOCE.rec=null;pulisciT();try{r.abort();}catch(x){}
    imposta("idle");stato("inattivo");log("Pagina in secondo piano: ascolto fermato.");
  }
  if(document.hidden)fermaVoce();
});
